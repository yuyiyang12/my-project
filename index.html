<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D枪战射击</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#0b0d10; font-family:"Barlow Condensed","Helvetica Neue",Arial,sans-serif; }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }

  /* crosshair: four bars whose gap tracks weapon spread */
  #cross { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:80px; height:80px; }
  #cross i { position:absolute; background:#e8f0e8; box-shadow:0 0 2px #000a; opacity:.85; }
  #cross i.h { width:7px; height:2px; top:39px; }
  #cross i.v { width:2px; height:7px; left:39px; }
  #cross .dot { width:2px; height:2px; left:39px; top:39px; border-radius:50%; }

  #hitmarker { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(1); opacity:0; }
  #hitmarker svg { display:block; }

  #bottomright { position:absolute; right:34px; bottom:26px; text-align:right; color:#fff; text-shadow:0 2px 6px #000c; }
  #ammo { font-size:46px; font-weight:600; letter-spacing:1px; line-height:.95; }
  #ammo small { font-size:22px; opacity:.6; font-weight:400; }
  #wname { font-size:15px; letter-spacing:3px; text-transform:uppercase; opacity:.55; margin-top:2px; }
  #firemode { font-size:12px; letter-spacing:2px; opacity:.4; }

  #bottomleft { position:absolute; left:34px; bottom:26px; color:#fff; text-shadow:0 2px 6px #000c; }
  #hpwrap { display:flex; align-items:flex-end; gap:10px; }
  #hp { font-size:46px; font-weight:600; line-height:.95; }
  #hpbar { width:190px; height:5px; background:#ffffff22; margin-top:9px; overflow:hidden; }
  #hpbar u { display:block; height:100%; width:100%; background:#e2e8e2; transition:width .18s ease-out; }
  #hpbar.low u { background:#d8483c; }

  #slots { position:absolute; right:34px; bottom:120px; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .slot { font-size:13px; letter-spacing:2px; color:#fff8; text-transform:uppercase; text-shadow:0 1px 4px #000; }
  .slot.on { color:#fff; }
  .slot b { display:inline-block; width:15px; color:#fff5; font-weight:400; }

  #damage { position:absolute; inset:0; box-shadow:inset 0 0 190px 40px #8b0f0abb; opacity:0; transition:opacity .35s; }
  #flash  { position:absolute; inset:0; background:#fff; opacity:0; }

  #killfeed { position:absolute; right:34px; top:24px; text-align:right; font-size:14px; letter-spacing:1px; }
  #killfeed div { color:#fff; text-shadow:0 1px 4px #000; margin-bottom:4px; opacity:.9; }
  #killfeed em { font-style:normal; color:#ff6a5a; }
  #killfeed b { font-weight:600; }

  #score { position:absolute; left:50%; top:16px; transform:translateX(-50%); display:flex; gap:14px;
           font-size:24px; color:#fff; text-shadow:0 1px 5px #000; letter-spacing:2px; align-items:baseline; }
  #score .team { display:flex; gap:9px; align-items:baseline; }
  #score b { font-size:12px; letter-spacing:3px; opacity:.75; font-weight:600; }
  #score i { font-style:normal; font-weight:600; font-variant-numeric:tabular-nums; }
  #score .sep { opacity:.28; font-size:12px; letter-spacing:2px; }
  #goalbar { position:absolute; left:50%; top:42px; transform:translateX(-50%); display:flex; gap:8px; align-items:center; }
  #goalbar .gb { width:110px; height:3px; background:#ffffff1f; overflow:hidden; }
  #goalbar .gb u { display:block; height:100%; width:0%; background:#7fa8d8; transition:width .3s ease-out; }
  #goalbar .gb:last-child u { float:right; background:#e8d44f; }
  #goalbar span { font-size:10px; letter-spacing:2px; color:#fff8; text-shadow:0 1px 4px #000; }
  #personal { position:absolute; left:50%; top:47px; transform:translateX(-50%); font-size:11px;
              letter-spacing:3px; color:#fff7; text-shadow:0 1px 4px #000; white-space:nowrap; }

  /* ally markers, drawn through walls -- the only reliable friend/foe cue at range */
  #markers div { position:absolute; left:0; top:0; font-size:11px; letter-spacing:1px; white-space:nowrap;
                 text-shadow:0 1px 4px #000, 0 0 2px #000; transform-origin:50% 100%; }
  #markers div s { display:block; text-decoration:none; font-size:13px; line-height:.8; text-align:center; }
  #markers div u { display:block; text-decoration:none; opacity:.55; font-size:9px; text-align:center; }

  #death { position:absolute; inset:0; display:none; place-content:center center; text-align:center;
           background:linear-gradient(#0000 35%, #200a08cc); color:#fff; }
  #death.on, #matchend.on { display:grid; }
  #pause { position:fixed; inset:0; display:none; place-content:center center; text-align:center;
           background:#000a; color:#fff; pointer-events:auto; cursor:pointer; z-index:50; }
  #pause.on { display:grid; }
  #pause .big { font-size:28px; letter-spacing:8px; font-weight:600; }
  #pause .sub { font-size:12px; letter-spacing:3px; opacity:.5; margin-top:12px; }
  #pause button { pointer-events:auto; margin-top:24px; background:#e2e8e2; color:#0b0d10; border:0;
           padding:12px 34px; font:600 14px/1 inherit; letter-spacing:3px; cursor:pointer; }
  #pause button:hover { background:#fff; }
  /* 靶场常驻退出按钮 */
  #btn-quit-range { position:absolute; top:18px; right:18px; display:none; pointer-events:auto;
           background:#e2e8e2cc; color:#0b0d10; border:0; padding:8px 18px;
           font:600 13px/1 inherit; letter-spacing:3px; cursor:pointer; }
  #btn-quit-range:hover { background:#fff; }
  #death .big { font-size:56px; letter-spacing:14px; font-weight:600; text-shadow:0 3px 20px #000; }
  #death .by { font-size:15px; letter-spacing:2px; opacity:.75; margin-top:10px; }
  #death .cd { font-size:12px; letter-spacing:3px; opacity:.45; margin-top:26px; text-transform:uppercase; }
  #death .cd span { font-variant-numeric:tabular-nums; color:#fff; opacity:.9; }

  #matchend { position:absolute; inset:0; display:none; place-content:center center; text-align:center;
              background:linear-gradient(#0008 30%, #0b0d10ee); color:#fff; pointer-events:auto; }
  #matchend .big { font-size:64px; letter-spacing:18px; font-weight:600; text-shadow:0 3px 24px #000; }
  #matchend .big.win { color:#8fd08f; }
  #matchend .big.lose { color:#e06a5a; }
  #matchend .final { font-size:26px; letter-spacing:4px; margin-top:14px; font-variant-numeric:tabular-nums; }
  #matchend .me-kd { font-size:14px; letter-spacing:2px; opacity:.65; margin-top:10px; }
  #me-board { margin:22px auto 0; border-collapse:collapse; font-size:14px; min-width:min(440px, 86vw);
              font-variant-numeric:tabular-nums; }
  #me-board th { font-size:11px; letter-spacing:3px; opacity:.5; font-weight:400; padding:4px 14px;
              border-bottom:1px solid #fff2; }
  #me-board td { padding:6px 14px; border-bottom:1px solid #fff1; }
  #me-board td:first-child { text-align:left; letter-spacing:1px; }
  #me-board tr.me td { color:#ffd24a; }
  #me-board tr.me td:first-child::after { content:" · 你"; opacity:.6; font-size:11px; }
  #matchend .cd { font-size:12px; letter-spacing:3px; opacity:.45; margin-top:24px; text-transform:uppercase; }
  #matchend .cd span { font-variant-numeric:tabular-nums; color:#fff; opacity:.9; }
  #start .mission { font-size:14px; letter-spacing:2px; color:#a8c8a0; margin-bottom:26px; opacity:.85; }

  /* 救援提示：靠近倒地队友时显示 */
  #revive { position:absolute; left:50%; top:60%; transform:translateX(-50%); text-align:center;
            color:#fff; letter-spacing:2px; pointer-events:none; display:none; }
  #revive .rv-t { font-size:15px; opacity:.9; }
  #revive .rv-bar { width:180px; height:5px; background:#ffffff22; margin:8px auto 0; border-radius:3px; }
  #revive .rv-fill { height:100%; width:0; background:#8fd08f; border-radius:3px; }

  #scope { position:absolute; inset:0; opacity:0; pointer-events:none;
           background:radial-gradient(circle at 50% 50%, transparent 0 27vh, #000 27.4vh);
           transition:opacity .06s; }
  #scope::after { content:""; position:absolute; inset:0;
           background:linear-gradient(#0000 calc(50% - .5px), #000 50%, #0000 calc(50% + .5px)),
                      linear-gradient(90deg, #0000 calc(50% - .5px), #000 50%, #0000 calc(50% + .5px)); }

  /* 红点镜（步枪/手枪/霰弹等，狙击枪除外）：开镜后整屏黑，只留中间
     圆形视野，圆心一颗红点（类似狙击镜，但分划换成红点） */
  #reddot { position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .08s;
            background:radial-gradient(circle at 50% 50%, transparent 0 24vh, #000 24.4vh); }
  /* 圆视野边缘的一圈暗红描边 */
  #reddot::before { content:""; position:absolute; left:50%; top:50%; width:48vh; height:48vh;
            transform:translate(-50%,-50%); border-radius:50%;
            border:1.5px solid #ff2a1e33; box-shadow:0 0 12px #ff2a1e22; }
  /* 中心红点：小而亮 */
  #reddot::after { content:""; position:absolute; left:50%; top:50%; width:7px; height:7px;
            transform:translate(-50%,-50%); border-radius:50%;
            background:#ff2a1e; box-shadow:0 0 8px #ff2a1ecc, 0 0 2px #fff8; }

  /* 调键位模式：可拖动的按钮高亮 */
  #touchui.editing .tbtn, #touchui.editing #tjoy { outline:2px dashed #ffd24a; outline-offset:3px; }
  #touchui.editing::after { content:"单指拖动调位置 · 双指捏合调大小 · 右上角完成"; position:absolute;
            top:56px; left:50%; transform:translateX(-50%); color:#ffd24a; font-size:13px;
            letter-spacing:1px; pointer-events:none; }
  #touchui .tbtn.moved, #tjoy.moved { position:fixed !important; transform:none !important;
            left:var(--lx) !important; top:var(--ly) !important; right:auto; bottom:auto; margin:0; }
  #layout-edit { display:none; position:fixed; top:12px; right:14px; z-index:30; gap:8px; flex-wrap:wrap; max-width:390px; justify-content:flex-end; align-items:center; }
  #layout-edit.on { display:flex; }
  #layout-edit button { pointer-events:auto; background:#e2e8e2; color:#0b0d10; border:0;
            padding:8px 16px; border-radius:8px; font-size:13px; letter-spacing:1px; touch-action:none; }
  #layout-size-name { flex-basis:100%; color:#ffe083; text-align:right; font:700 13px sans-serif; text-shadow:0 1px 3px #000; }
  #touchui .layout-selected { outline:3px solid #63ddff !important; outline-offset:4px !important; }

  #start { position:fixed; inset:0; background:#000; display:block; overflow-y:auto; pointer-events:auto; }
  #start .card { min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; color:#dfe6df; padding:24px 6vw; }
  #start h1 { font-size:40px; letter-spacing:6px; font-weight:600; margin-bottom:6px; }
  #start h2 { font-size:13px; letter-spacing:4px; opacity:.4; margin-bottom:30px; text-transform:uppercase; }
  #start .keys { display:grid; grid-template-columns:auto auto; gap:5px 16px; font-size:14px; opacity:.62; text-align:left;
                 margin:0 auto 30px; width:max-content; }
  #start .keys b { font-weight:600; color:#fff; }
  #start button { pointer-events:auto; background:#e2e8e2; color:#0b0d10; border:0; padding:13px 40px;
                  font:600 15px/1 inherit; letter-spacing:3px; cursor:pointer; text-transform:uppercase; }
  #start button:hover { background:#fff; }
  #loading { font-size:13px; opacity:.45; letter-spacing:2px; }

  /* 大厅 · 地图选择 */
  #mapcards { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:0 auto 28px; max-width:1200px; }
  #mapcards .mapcard { flex:1 1 200px; max-width:280px; }
  .mapcard { width:210px; padding:16px 18px 14px; border:1px solid #ffffff2a; border-radius:8px;
             background:#ffffff08; cursor:pointer; pointer-events:auto; text-align:left;
             transition:border-color .15s, background .15s, transform .15s; }
  .mapcard:hover { background:#ffffff12; transform:translateY(-2px); }
  .mapcard.sel { border-color:#8fd08f; background:#8fd08f14; box-shadow:0 0 0 1px #8fd08f66; }
  .mapcard b { display:block; font-size:17px; letter-spacing:4px; font-weight:600; margin-bottom:6px; }
  .mapcard span { display:block; font-size:12px; letter-spacing:1px; line-height:1.6; opacity:.55; }
  @media (max-width:700px) { #mapcards, #modecards { flex-direction:column; align-items:center; } }

  /* 大厅：介绍 / 模式卡 / 灵敏度 */
  #start .intro { font-size:14px; line-height:1.9; letter-spacing:1px; color:#c9d2c9;
    max-width:460px; margin:0 auto 26px; opacity:.8; }
  .picklabel { font-size:12px; letter-spacing:5px; opacity:.4; margin:0 0 12px; text-transform:uppercase; }
  #modecards { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:0 auto 26px; max-width:1200px; }
  #modecards .mapcard { flex:1 1 180px; max-width:300px; }
  #sensrow { margin:0 auto 26px; width:280px; max-width:80%; }
  #sensrow input { width:100%; accent-color:#8fd08f; pointer-events:auto; cursor:pointer; }
  #sensval { color:#8fd08f; opacity:.95; letter-spacing:1px; margin-left:6px; }
  .mapcard.dim { display:none; }

  /* 爆破模式状态条（顶部中央，比分下方） */
  #bombhud { position:absolute; left:50%; top:74px; transform:translateX(-50%);
    display:flex; align-items:center; gap:12px; padding:8px 18px;
    background:#0a0c0e8c; border:1px solid #ffffff30; border-radius:6px;
    color:#fff; letter-spacing:1px; font-size:13px; white-space:nowrap; }
  #bombhud b { font-size:18px; font-variant-numeric:tabular-nums; color:#ffd28a; }
  #bomb-barwrap { width:110px; height:5px; background:#ffffff1c; border-radius:3px; overflow:hidden; }
  #bomb-bar { display:block; height:100%; width:0%; background:#ffb84f; transition:width .1s linear; }
  #bomb-hint { opacity:.7; font-size:12px; }

  /* 中央公告 */
  #announce { position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none;
    opacity:0; }
  #announce.on { animation:ann 2.6s ease-out forwards; }
  #announce .t { font-size:44px; letter-spacing:14px; font-weight:600; color:#fff;
    text-shadow:0 3px 22px #000; }
  #announce .s { font-size:14px; letter-spacing:4px; color:#d8c9a8; margin-top:10px;
    text-shadow:0 2px 10px #000; }
  @keyframes ann {
    0% { opacity:0; transform:translateY(14px); }
    10% { opacity:1; transform:none; }
    78% { opacity:1; }
    100% { opacity:0; transform:translateY(-10px); }
  }

  #stats { position:absolute; left:10px; top:8px; font:11px/1.5 ui-monospace,monospace; color:#8fdc9a99; white-space:pre; }
  #minimap { position:absolute; left:16px; top:44px; width:200px; height:200px;
    border:1px solid #ffffff40; border-radius:4px; background:#0a0c0e8c;
    box-shadow:0 2px 12px #00000073; }
  #portalhud { position:absolute; left:16px; top:252px; font-size:12px; line-height:1.8;
    letter-spacing:2px; color:#fff; text-shadow:0 1px 4px #000; pointer-events:none; }
  #portalhud .fl { animation:portalfl .45s steps(2,end) infinite; }
  @keyframes portalfl { 50% { opacity:.2; } }

  /* ── 触屏操控（仅触屏设备由 JS 点亮） ── */
  html, body { touch-action:none; overscroll-behavior:none; }
  #touchui { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
  #tjoy { position:absolute; left:26px; bottom:110px; width:128px; height:128px;
    border:2px solid #ffffff38; border-radius:50%; background:#ffffff0d;
    pointer-events:auto; touch-action:none; }
  #tknob { position:absolute; left:50%; top:50%; width:54px; height:54px;
    border-radius:50%; background:#ffffff2e; border:2px solid #ffffff59;
    transform:translate(-50%,-50%); }
  #touchui .tcol { position:absolute; right:14px; bottom:90px; display:flex;
    flex-direction:column; gap:9px; align-items:flex-end; }
  #touchui .trow { display:flex; gap:9px; align-items:flex-end; }
  /* 驾驶载具时只保留摇杆、暂停和开火，隐藏跳、蹲等步兵动作。 */
  #touchui.vehicle-driving:not(.editing) .tcol .tbtn:not([data-k="fire"]) { display:none; }
  .tbtn { pointer-events:auto; touch-action:none; user-select:none; -webkit-user-select:none;
    width:60px; height:60px; border-radius:50%; border:2px solid #ffffff42;
    background:#13161ab8; color:#e8f0e8; font:600 13px/1.2 inherit; letter-spacing:0; }
  .tbtn.big { width:92px; height:92px; background:#8c2f2fb0; border-color:#ff8a7a66;
    font-size:19px; }
  .tbtn.small { width:48px; height:48px; font-size:11px; }
  .tbtn.on { background:#e8f0e8; color:#13161a; }

  /* ════════ 移动端强制横屏 ════════ */
  #rotate-overlay { position:fixed; inset:0; z-index:10000; background:#0b0d10;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    color:#dfe6df; text-align:center; padding:20px; }
  #rotate-overlay .ico { width:64px; height:64px; border:3px solid #8fd08f; border-radius:10px;
    animation:rot90 1.6s ease-in-out infinite; }
  #rotate-overlay .t { font-size:20px; letter-spacing:4px; }
  #rotate-overlay .s { font-size:13px; letter-spacing:2px; opacity:.55; }
  @keyframes rot90 { 0%,25% { transform:rotate(0); } 55%,100% { transform:rotate(90deg); } }

  /* 小屏 HUD 收缩 */
  @media (max-width: 900px), (pointer:coarse) {
    #minimap { width:120px; height:120px; left:10px; top:36px; }
    #portalhud { top:162px; left:10px; font-size:10px; }
    #stats { display:none; }
    #slots { right:14px; bottom:300px; }
    #bottomright { right:16px; bottom:30px; }
    #bottomleft { left:16px; bottom:30px; }
    
  }
  #onlinerow { margin:0 auto 26px; width:280px; max-width:80%; }
  #onlinerow select, #onlinerow input { pointer-events:auto; }

  /* ════════ 战术风大厅精修 ════════ */
  #start { background:
      radial-gradient(ellipse 90% 60% at 50% -8%, #151d17 0%, #0a0e0b 52%, #060809 100%); }
  #start::before { content:""; position:absolute; inset:0; pointer-events:none;
      background:
        linear-gradient(#ffffff07 1px, transparent 1px),
        linear-gradient(90deg, #ffffff07 1px, transparent 1px);
      background-size:46px 46px;
      -webkit-mask-image:radial-gradient(ellipse 70% 65% at 50% 38%, #000 0%, transparent 76%);
      mask-image:radial-gradient(ellipse 70% 65% at 50% 38%, #000 0%, transparent 76%); }
  #start::after { content:""; position:absolute; inset:14px; pointer-events:none;
      border:1px solid #ffffff10;
      -webkit-mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000),
        linear-gradient(#000,#000),linear-gradient(#000,#000);
      -webkit-mask-size:120px 1px,1px 120px,120px 1px,1px 120px;
      -webkit-mask-position:left top,left top,right bottom,right bottom;
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
  #start .card { max-width:1560px; margin:0 auto; position:relative; z-index:1;
      padding-top:30px; padding-bottom:40px; }

  /* 战术小标题（眉标） */
  .tac-eyebrow { font-size:11px; letter-spacing:6px; color:#a8c78a; opacity:.9;
      display:flex; align-items:center; gap:10px; width:max-content; margin:0 auto 10px; }
  .tac-eyebrow::before, .tac-eyebrow::after { content:""; width:26px; height:1px;
      background:linear-gradient(90deg,transparent,#a8c78a); }
  .tac-eyebrow::after { background:linear-gradient(90deg,#a8c78a,transparent); }
  #start h1 { font-size:44px; font-weight:700; letter-spacing:10px; margin-bottom:4px; }
  #start h2 { letter-spacing:5px; margin-bottom:26px; }

  /* 分区标签：两侧加短线 */
  .picklabel { display:flex; align-items:center; gap:14px; width:100%;
      justify-content:center; letter-spacing:6px; }
  .picklabel::before, .picklabel::after { content:""; width:54px; height:1px;
      background:linear-gradient(90deg,transparent,#ffffff33); }
  .picklabel::after { background:linear-gradient(90deg,#ffffff33,transparent); }
  #start .intro { opacity:.72; }

  /* 卡片：硬朗切角 + 选中侧条 + 勾选 */
  .mapcard { border-radius:2px; position:relative; overflow:hidden;
      background:linear-gradient(180deg,#ffffff0b,#ffffff03);
      border:1px solid #ffffff1d; }
  .mapcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
      background:transparent; transition:background .15s; }
  .mapcard::after { content:""; position:absolute; top:7px; right:9px; width:7px; height:7px;
      border:1px solid #ffffff44; border-radius:1px; transition:.15s; }
  .mapcard:hover { border-color:#ffffff42; background:linear-gradient(180deg,#ffffff14,#ffffff06); }
  .mapcard.sel { border-color:#a8c78a; background:linear-gradient(180deg,#a8c78a14,#a8c78a07);
      box-shadow:inset 0 0 0 1px #a8c78a40; }
  .mapcard.sel::before { background:#a8c78a; }
  .mapcard.sel::after { border-color:#a8c78a; background:#a8c78a;
      box-shadow:0 0 6px #a8c78a88; }
  .mapcard span { opacity:.6; }
  #modecards { margin-top:18px; }
  #modecards .mapcard { flex:1 1 180px; max-width:300px; }

<!-- 灵敏度设置面板 -->
<div id="sens-panel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10000;background:#1a1a2ecc;padding:20px;border-radius:12px;border:1px solid #4a5d23;max-width:90vw;max-height:80vh;overflow-y:auto;color:#fff;">

    </div>

    <div style="margin-bottom:15px;">
        <label style="display:block;margin-bottom:5px;">水平灵敏度: <span id="sens-x-val">1.0</span></label>
        <input type="range" id="sens-x" min="0.1" max="3" step="0.1" value="1" style="width:100%;">
    </div>

    <div style="margin-bottom:15px;">
        <label style="display:block;margin-bottom:5px;">开镜灵敏度（红点/全息）: <span id="sens-ads-val">1.0</span></label>
        <input type="range" id="sens-ads" min="0.1" max="3" step="0.1" value="1" style="width:100%;">
    </div>

    <div style="margin-bottom:15px;">
        <label style="display:block;margin-bottom:5px;">开镜灵敏度（高倍镜）: <span id="sens-scope-val">0.8</span></label>
        <input type="range" id="sens-scope" min="0.1" max="3" step="0.1" value="0.8" style="width:100%;">
    </div>

    <div style="margin-bottom:15px;">
        <label style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="gyro-enable"> 开启陀螺仪
        </label>
    </div>

    <div id="gyro-settings" style="display:none;margin-bottom:15px;padding-left:15px;border-left:2px solid #4a5d23;">
        <div style="margin-bottom:10px;">
            <label style="display:block;margin-bottom:5px;">陀螺仪灵敏度: <span id="gyro-sens-val">1.0</span></label>
            <input type="range" id="gyro-sens" min="0.1" max="5" step="0.1" value="1" style="width:100%;">
        </div>
        <div style="margin-bottom:10px;">
            <label style="display:block;margin-bottom:5px;">陀螺仪垂直灵敏度: <span id="gyro-y-val">1.0</span></label>
            <input type="range" id="gyro-y" min="0.1" max="3" step="0.1" value="1" style="width:100%;">
        </div>
        <div>
            <label style="display:block;margin-bottom:5px;">陀螺仪水平灵敏度: <span id="gyro-x-val">1.0</span></label>
            <input type="range" id="gyro-x" min="0.1" max="3" step="0.1" value="1" style="width:100%;">
        </div>
    </div>

    <button id="sens-close" style="width:100%;padding:12px;background:#4a5d23;color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:10px;">保存并关闭</button>
</div>

<script>
// 灵敏度配置
var sensitivityConfig = {
    total: 3.0,
    y: 1.0,
    x: 1.0,
    ads: 1.0,
    scope: 0.8,
    gyroEnabled: false,
    gyroSens: 1.0,
    gyroY: 1.0,
    gyroX: 1.0
};

// 加载保存的配置
try {
    var saved = localStorage.getItem('sensitivityConfig');
    if (saved) {
        sensitivityConfig = JSON.parse(saved);
        // 应用到 UI
        document.getElementById('sens-total').value = sensitivityConfig.total;
        document.getElementById('sens-y').value = sensitivityConfig.y;
        document.getElementById('sens-x').value = sensitivityConfig.x;
        document.getElementById('sens-ads').value = sensitivityConfig.ads;
        document.getElementById('sens-scope').value = sensitivityConfig.scope;
        document.getElementById('gyro-enable').checked = sensitivityConfig.gyroEnabled;
        document.getElementById('gyro-sens').value = sensitivityConfig.gyroSens;
        document.getElementById('gyro-y').value = sensitivityConfig.gyroY;
        document.getElementById('gyro-x').value = sensitivityConfig.gyroX;
        updateLabels();
    }
} catch(e) {}

function updateLabels() {
    document.getElementById('sens-total-val').textContent = sensitivityConfig.total.toFixed(1);
    document.getElementById('sens-y-val').textContent = sensitivityConfig.y.toFixed(1);
    document.getElementById('sens-x-val').textContent = sensitivityConfig.x.toFixed(1);
    document.getElementById('sens-ads-val').textContent = sensitivityConfig.ads.toFixed(1);
    document.getElementById('sens-scope-val').textContent = sensitivityConfig.scope.toFixed(1);
    document.getElementById('gyro-sens-val').textContent = sensitivityConfig.gyroSens.toFixed(1);
    document.getElementById('gyro-y-val').textContent = sensitivityConfig.gyroY.toFixed(1);
    document.getElementById('gyro-x-val').textContent = sensitivityConfig.gyroX.toFixed(1);
}

// 绑定滑块
document.getElementById('sens-total').addEventListener('input', function() {
    sensitivityConfig.total = parseFloat(this.value);
    updateLabels();
});
document.getElementById('sens-y').addEventListener('input', function() {
    sensitivityConfig.y = parseFloat(this.value);
    updateLabels();
});
document.getElementById('sens-x').addEventListener('input', function() {
    sensitivityConfig.x = parseFloat(this.value);
    updateLabels();
});
document.getElementById('sens-ads').addEventListener('input', function() {
    sensitivityConfig.ads = parseFloat(this.value);
    updateLabels();
});
document.getElementById('sens-scope').addEventListener('input', function() {
    sensitivityConfig.scope = parseFloat(this.value);
    updateLabels();
});
document.getElementById('gyro-enable').addEventListener('change', function() {
    sensitivityConfig.gyroEnabled = this.checked;
    document.getElementById('gyro-settings').style.display = this.checked ? 'block' : 'none';
});
document.getElementById('gyro-sens').addEventListener('input', function() {
    sensitivityConfig.gyroSens = parseFloat(this.value);
    updateLabels();
});
document.getElementById('gyro-y').addEventListener('input', function() {
    sensitivityConfig.gyroY = parseFloat(this.value);
    updateLabels();
});
document.getElementById('gyro-x').addEventListener('input', function() {
    sensitivityConfig.gyroX = parseFloat(this.value);
    updateLabels();
});

// 打开/关闭面板
document.getElementById('sens-btn').addEventListener('click', function() {
    document.getElementById('sens-panel').style.display = 'block';
});
document.getElementById('sens-close').addEventListener('click', function() {
    document.getElementById('sens-panel').style.display = 'none';
    // 保存
    try {
        localStorage.setItem('sensitivityConfig', JSON.stringify(sensitivityConfig));
    } catch(e) {}
    // 应用到游戏
    if (window.applySensitivity) {
        window.applySensitivity(sensitivityConfig);
    }
});

// 陀螺仪
if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', function(e) {
        if (!sensitivityConfig.gyroEnabled) return;
        if (!window.MP || !window.MP.game || !window.MP.game.player) return;

        var player = window.MP.game.player;
        var gyroScale = 0.02 * sensitivityConfig.gyroSens;

        //  beta = 前后倾斜（X轴），gamma = 左右倾斜（Y轴）
        if (e.beta !== null) {
            player.yaw -= e.gamma * gyroScale * sensitivityConfig.gyroX;
            player.pitch -= e.beta * gyroScale * sensitivityConfig.gyroY;

            // 限制 pitch
            player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
        }
    });
}
</script>

<script>
// Tab 键计分板
document.addEventListener('keydown', function(e) {
    if (e.code === 'Tab') {
        e.preventDefault();
        var sb = document.getElementById('scoreboard');
        if (sb.style.display === 'none') {
            // 显示并更新数据
            updateScoreboard();
            sb.style.display = 'block';
        } else {
            sb.style.display = 'none';
        }
    }
});

function updateScoreboard() {
    var tbody = document.getElementById('scoreboard-body');
    tbody.innerHTML = '';

    try {
        var game = window.MP && window.MP.game;
        if (!game) return;

        // 玩家自己
        var player = game.player;
        if (player) {
            addRow(tbody, '你', player.kills||0, player.deaths||0, player.assists||0, true);
        }

        // Bot
        if (game.bots) {
            game.bots.forEach(function(bot, i) {
                addRow(tbody, 'Bot '+(i+1), bot.kills||0, bot.deaths||0, bot.assists||0, false);
            });
        }
    } catch(e) {}
}

function addRow(tbody, name, kills, deaths, assists, isPlayer) {
    var tr = document.createElement('tr');
    if (isPlayer) tr.style.color = '#8fd08f';
    tr.innerHTML = '<td style="padding:8px;">'+name+'</td>' +
                   '<td style="padding:8px;text-align:center;">'+kills+'</td>' +
                   '<td style="padding:8px;text-align:center;">'+deaths+'</td>' +
                   '<td style="padding:8px;text-align:center;">'+assists+'</td>';
    tbody.appendChild(tr);
}
</script>

<script>
// 皮肤配置
var weaponSkins = {};
try {
    var saved = localStorage.getItem('weaponSkins');
    if (saved) weaponSkins = JSON.parse(saved);
} catch(e) {}

var skinColors = {
    default: null,
    red: [0.8, 0.2, 0.2, 1],
    blue: [0.2, 0.5, 0.9, 1],
    green: [0.2, 0.7, 0.3, 1],
    gold: [0.9, 0.7, 0.2, 1],
    purple: [0.6, 0.3, 0.8, 1],
    black: [0.1, 0.1, 0.15, 1],
    white: [0.9, 0.9, 0.95, 1],
    orange: [0.9, 0.5, 0.1, 1]
};

// 应用皮肤
function applySkin(weaponName, skinName) {
    weaponSkins[weaponName] = skinName;
    try { localStorage.setItem('weaponSkins', JSON.stringify(weaponSkins)); } catch(e) {}

    // 应用到游戏
    if (window.MP && window.MP.game && window.MP.game.weapons) {
        var weapons = window.MP.game.weapons.weapons;
        if (weapons && weapons.has(weaponName)) {
            var weapon = weapons.get(weaponName);
            if (weapon && weapon.model) {
                var color = skinColors[skinName];
                weapon.model.traverse(function(obj) {
                    if (obj.isMesh && obj.material) {
                        if (!obj.userData.originalColor) {
                            obj.userData.originalColor = obj.material.color.clone();
                        }
                        if (color) {
                            obj.material.color.setRGB(color[0], color[1], color[2]);
                        } else {
                            obj.material.color.copy(obj.userData.originalColor);
                        }
                    }
                });
            }
        }
    }
}

<div id="rotate-overlay">
  <div class="ico"></div>
  <div class="t">请旋转屏幕</div>
  <div class="s">本游戏需要横屏体验 · ROTATE TO LANDSCAPE</div>
</div>
<script>
/* 移动端强制横屏：竖屏遮罩 + 尝试系统级锁定 */
(function(){
  var overlay = document.getElementById('rotate-overlay');
  var isTouch = window.matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  function portrait(){ return window.innerHeight > window.innerWidth; }
  function update(){
    if(isTouch && portrait()){ overlay.style.display='flex'; }
    else { overlay.style.display='none'; }
  }
  function tryLock(){
    try{
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').catch(function(){});
      }
    }catch(e){}
  }
  window.addEventListener('resize', update);
  window.addEventListener('orientationchange', function(){ setTimeout(update,120); });
  document.addEventListener('visibilitychange', update);
  document.addEventListener('touchstart', function once(){
    tryLock(); update();
    document.removeEventListener('touchstart', once);
  });
  update();
  setTimeout(update, 500);
})();
</script>

<script>
/* ════════ 好友系统（MQTT presence + 1V1 邀请） ════════ */
(function(){
  var BROKER='wss://broker.emqx.io:8084/mqtt';
  var uid=localStorage.getItem('pd_uid');
  if(!uid){uid='PD'+Math.random().toString(36).slice(2,8).toUpperCase().replace(/[^A-Z0-9]/g,'X');localStorage.setItem('pd_uid',uid);}
  var uname=localStorage.getItem('pd_uname');
  if(!uname){uname='玩家'+Math.floor(Math.random()*1000);localStorage.setItem('pd_uname',uname);}
  var upass=localStorage.getItem('pd_pass')||'';
  function publishName(old){
    if(!client||!client.connected)return;
    try{
      client.publish('portalduel/friends/names/'+uname,JSON.stringify({id:uid,name:uname}),{retain:true});
      if(old&&old!==uname)client.publish('portalduel/friends/names/'+old,'',{retain:true});
    }catch(e){}
  }
  /* ── 进入游戏前的身份设置：名字 + 密码，保存在本地 ── */
  function buildLoginUI(){
    var mask=document.createElement('div');mask.id='loginmask';
    mask.innerHTML='<div id="loginbox"><h2>设置你的身份</h2>'
      +'<p>进入游戏前，给自己起一个名字并设置密码。<br>名字和密码只保存在这台设备上（浏览器本地）。</p>'
      +'<input id="lg-name" maxlength="12" placeholder="名字（1–12 个字符）" autocomplete="off">'
      +'<input id="lg-pass" type="password" maxlength="24" placeholder="密码（至少 4 位）" autocomplete="off">'
      +'<div class="lerr" id="lg-err"></div>'
      +'<button id="lg-go">确定，进入游戏</button>'
      +'<div class="lhint">好友通过这个名字找到你 · 密码用于在本机切换身份时验证</div></div>';
    document.body.appendChild(mask);
    return mask;
  }
  function openLogin(switchMode){
    var mask=document.getElementById('loginmask')||buildLoginUI();
    mask.style.display='flex';
    var nm=document.getElementById('lg-name'),pw=document.getElementById('lg-pass'),er=document.getElementById('lg-err'),go=document.getElementById('lg-go');
    nm.value=switchMode?'':uname; pw.value=''; er.textContent='';
    document.getElementById('loginbox').getElementsByTagName('h2')[0].textContent=switchMode?'切换账号（需输入当前密码）':'设置你的身份';
    setTimeout(function(){(switchMode?pw:nm).focus()},50);
    go.onclick=function(){
      var n=(nm.value||'').trim(),p=pw.value||'';
      if(!n){er.textContent='请输入名字';return;}
      if(n.length>12){er.textContent='名字太长了';return;}
      if(p.length<4){er.textContent='密码至少 4 位';return;}
      if(switchMode&&p!==upass){er.textContent='密码不对，无法切换身份';return;}
      var old=uname; uname=n; upass=p;
      localStorage.setItem('pd_uname',uname); localStorage.setItem('pd_pass',upass);
      mask.style.display='none';
      publishName(old);
      if(client&&client.connected){publishPresence('online');try{el('fp-status').textContent='好友服务已连接 · 昵称 '+uname}catch(e){}}
      render();
    };
  }
  if(!upass) openLogin(false);
  var friends=[]; try{friends=JSON.parse(localStorage.getItem('pd_friends')||'[]')}catch(e){}
  var online={};
  var client=null;
  var chatWith=null;          // 当前聊天对象好友 ID
  var unread={};              // 各好友未读数
  var chatLogs={};            // 各好友消息数组 {from,name,text,ts,me}
  function loadChat(id){if(chatLogs[id])return;try{chatLogs[id]=JSON.parse(localStorage.getItem('pd_chat_'+id)||'[]')}catch(e){chatLogs[id]=[]}}
  function saveChat(id){try{localStorage.setItem('pd_chat_'+id,JSON.stringify((chatLogs[id]||[]).slice(-100)))}catch(e){}}
  window.__fpInvite=null;
  window.__fpDebug={online:online,getClient:function(){return client}};
  function el(id){return document.getElementById(id)}
  function save(){try{localStorage.setItem('pd_friends',JSON.stringify(friends))}catch(e){}}
  function render(){
    var list=el('fp-list'); if(!list)return;
    if(!friends.length){list.innerHTML='<div class="fp-empty">还没有好友 · 把「我的 ID」发给朋友，让对方添加你</div>';return;}
    list.innerHTML=friends.map(function(f){
      var on=online[f.id]&&online[f.id].status==='online';
      var nm=(online[f.id]&&online[f.id].name)||f.name||f.id;
      var ub=unread[f.id]?(' <span style="color:#ff6a5a;font-size:11px">('+unread[f.id]+')</span>'):'';
      return '<div class="fp-item"><span class="fp-dot '+(on?'on':'')+'"></span>'
        +'<span class="fp-name">'+nm+ub+' <span style="opacity:.45;font-size:11px">'+f.id+'</span></span>'
        +'<button class="fp-invite fp-chatbtn" data-id="'+f.id+'">聊天</button>'
        +(on?'<button class="fp-invite" data-id="'+f.id+'">1V1</button><button class="fp-squad" data-id="'+f.id+'">组队</button>':'<span class="fp-off">离线</span>')
        +'<button class="fp-del" data-id="'+f.id+'" title="删除好友">×</button></div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.fp-chatbtn'),function(b){b.onclick=function(){openChat(b.dataset.id)}});
    Array.prototype.forEach.call(list.querySelectorAll('.fp-invite:not(.fp-chatbtn)'),function(b){b.onclick=function(){invite(b.dataset.id,false)}});
    Array.prototype.forEach.call(list.querySelectorAll('.fp-squad'),function(b){b.onclick=function(){invite(b.dataset.id,true)}});
    Array.prototype.forEach.call(list.querySelectorAll('.fp-del'),function(b){b.onclick=function(){
      if(!confirm('删除好友 '+b.dataset.id+'？'))return;
      friends=friends.filter(function(f){return f.id!==b.dataset.id});save();render();}});
  }
  function publishPresence(st){
    if(client&&client.connected){try{client.publish('portalduel/friends/presence/'+uid,
      JSON.stringify({id:uid,name:uname,status:st,ts:Date.now()}),{retain:true})}catch(e){}}
  }
  function subscribeFriend(id){if(client&&client.connected)try{client.subscribe('portalduel/friends/presence/'+id)}catch(e){}}
  function connect(){
    if(typeof mqtt==='undefined'){el('fp-status').textContent='MQTT 未加载';return;}
    try{
      client=mqtt.connect(BROKER,{clientId:'pdf_'+uid+'_'+Math.random().toString(36).slice(2,6),
        reconnectPeriod:5000,connectTimeout:8000,
        will:{topic:'portalduel/friends/presence/'+uid,
          payload:JSON.stringify({id:uid,name:uname,status:'offline',ts:Date.now()}),retain:true,qos:0}});
    }catch(e){el('fp-status').textContent='好友服务连接失败';return;}
    client.on('connect',function(){
      el('fp-status').textContent='好友服务已连接 · 昵称 '+uname;
      publishPresence('online');publishName();
      try{client.subscribe('portalduel/friends/invite/'+uid);client.subscribe('portalduel/friends/chat/'+uid)}catch(e){}
      friends.forEach(function(f){subscribeFriend(f.id)});
    });
    client.on('reconnect',function(){el('fp-status').textContent='好友服务重连中…'});
    client.on('offline',function(){el('fp-status').textContent='好友服务已离线 · 每 5 秒自动重连（也可点「重连」）'});
    client.on('error',function(e){el('fp-status').textContent='好友服务出错 · '+((e&&e.message)||'网络异常')+' · 自动重连中'});
    client.on('message',function(topic,payload){
      var msg; try{msg=JSON.parse(payload.toString())}catch(e){return}
      if(topic.indexOf('portalduel/friends/presence/')===0){
        var fid=topic.split('/').pop();
        if(msg&&msg.status==='online')online[fid]={name:msg.name,status:'online'};
        else delete online[fid];
        render();
      }else if(topic==='portalduel/friends/chat/'+uid){
        if(!msg||!msg.from||!msg.text)return;
        loadChat(msg.from);
        chatLogs[msg.from].push({from:msg.from,name:msg.fromName,text:String(msg.text).slice(0,200),ts:msg.ts||Date.now(),me:false});
        saveChat(msg.from);
        if(chatWith===msg.from){renderChat();}
        else{unread[msg.from]=(unread[msg.from]||0)+1;render();
          try{el('fp-status').textContent='💬 '+(msg.fromName||msg.from)+'：'+String(msg.text).slice(0,30)}catch(e){}}
      }else if(topic==='portalduel/friends/invite/'+uid){
        window.__fpInvite=msg;
        if(msg&&msg.room){
          if(confirm((msg.fromName||msg.from||'好友')+(msg.type==='squad'?' 邀请你组队打 AI':' 邀请你 1V1 对战')+'（房间码 '+msg.room+'）\n确定：填入房间码并选择联机模式')){
            window._mpSquad=msg.type==='squad';window._mpInviteSelecting=true;
            var ri=document.getElementById('roomcode'); if(ri)ri.value=msg.room;
            var oc=document.querySelector('.mapcard[data-mode="online"]'); if(oc)oc.dispatchEvent(new MouseEvent('click',{bubbles:true}));
            var st=document.getElementById('start'); if(st)st.scrollTop=st.scrollHeight;
          }
        }
      }
    });
  }
  function renderChat(){
    var log=el('fp-chatlog'); if(!log)return;
    if(!chatWith){log.innerHTML='<div class="c-sys">点击好友右侧「聊天」按钮，选择聊天对象</div>';return;}
    var arr=chatLogs[chatWith]||[];
    log.innerHTML=arr.map(function(m){
      var t=new Date(m.ts||Date.now());
      var hh=(t.getHours()<10?'0':'')+t.getHours()+':'+(t.getMinutes()<10?'0':'')+t.getMinutes();
      return '<div class="c-msg '+(m.me?'c-me':'c-them')+'"><span class="c-time">'+hh+'</span><b>'+(m.me?'我':(m.name||m.from))+'：</b>'+escapeHtml(m.text)+'</div>';
    }).join('')||'<div class="c-sys">还没有消息，打个招呼吧</div>';
    log.scrollTop=log.scrollHeight;
  }
  function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function openChat(fid){
    chatWith=fid;unread[fid]=0;
    loadChat(fid);
    var f=friends.filter(function(x){return x.id===fid})[0];
    el('fp-chathead').textContent='好友聊天 · 与 '+(f?(f.name||fid):fid)+'（'+fid+'）';
    render();renderChat();
    try{el('fp-chatinput').focus()}catch(e){}
  }
  function sendChat(){
    var inp=el('fp-chatinput');
    var text=(inp.value||'').trim(); if(!text)return;
    // 聊天输入框快捷加好友：/add 名字 或 /加 名字
    var m=text.match(/^\/(add|加)\s+(.+)$/i);
    if(m){
      inp.value='';
      var name=m[2].trim();
      if(/^PD[A-Z0-9]{4,10}$/i.test(name)){addFriendId(name.toUpperCase(),name.toUpperCase());}
      else lookupName(name.slice(0,12),function(err,id,realName){
        if(err){alert(err);return;}
        addFriendId(id,realName);
      });
      return;
    }
    if(!chatWith){alert('先点击好友右侧的「聊天」按钮选择聊天对象');return;}
    var on=online[chatWith]&&online[chatWith].status==='online';
    if(!on&&!confirm('该好友当前离线，消息可能无法送达（对方上线后收不到离线消息）。仍要发送吗？'))return;
    if(client&&client.connected){try{client.publish('portalduel/friends/chat/'+chatWith,
      JSON.stringify({from:uid,fromName:uname,text:text,ts:Date.now()}))}catch(e){}}
    loadChat(chatWith);
    chatLogs[chatWith].push({from:uid,name:uname,text:text,ts:Date.now(),me:true});
    saveChat(chatWith);
    inp.value='';renderChat();
  }
  function invite(fid,squad){
    var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code='';
    for(var i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
    window._mpSquad=!!squad;window._mpInviteSelecting=true;
    try{if(window.publishRoom)window.publishRoom(code,uname+(squad?' 的组队':' 的1V1'));window._mpRoomCode=code;}catch(e){}
    if(client&&client.connected){try{client.publish('portalduel/friends/invite/'+fid,
      JSON.stringify({from:uid,fromName:uname,room:code,type:squad?'squad':'duel',ts:Date.now()}))}catch(e){}}
    var ri=document.getElementById('roomcode'); if(ri)ri.value=code;
    var oc=document.querySelector('.mapcard[data-mode="online"]'); if(oc)oc.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    alert((squad?'组队':'1V1')+'邀请已发送给 '+fid+'！\n房间码 '+code+' 已自动填入，直接点「部署」等待好友加入即可。'+(squad?'\n两人会在同一队，对抗 AI。':''));
  }
  function addFriendId(id,name){
    if(id===uid){alert('不能添加自己为好友');return;}
    if(friends.some(function(f){return f.id===id})){alert('已经是好友了');return;}
    friends.push({id:id,name:name||id});save();subscribeFriend(id);
    render();
  }
  function lookupName(v,done){
    // 通过保留消息的名字索引查 ID：portalduel/friends/names/<名字>
    var topic='portalduel/friends/names/'+v,found=false,got=false;
    function h(t,payload){
      if(t!==topic)return;
      got=true;
      try{client.removeListener('message',h)}catch(e){}
      var msg=null; try{msg=JSON.parse(payload.toString())}catch(e){}
      if(msg&&msg.id){found=true;done(null,msg.id,msg.name||v);}
    }
    try{
      client.on('message',h);
      client.subscribe(topic,function(err){
        if(err){try{client.removeListener('message',h)}catch(e){};done('查询失败');return;}
        setTimeout(function(){
          try{client.removeListener('message',h)}catch(e){}
          try{client.unsubscribe(topic)}catch(e){}
          if(!found)done('没有找到名字叫「'+v+'」的玩家。\n对方需要用新版本上线过一次，名字才会登记。');
        },3000);
      });
    }catch(e){done('查询失败');}
  }
  function addFriend(){
    var raw=(el('fp-add').value||'').trim();
    if(!raw)return;
    var v=raw.toUpperCase();
    if(/^PD[A-Z0-9]{4,10}$/.test(v)){
      addFriendId(v,v);
      el('fp-add').value='';
      return;
    }
    // 按名字添加
    var name=raw.slice(0,12);
    el('fp-status').textContent='正在查找玩家「'+name+'」…';
    lookupName(name,function(err,id,realName){
      if(err){el('fp-status').textContent=err;alert(err);return;}
      addFriendId(id,realName);
      el('fp-add').value='';
      el('fp-status').textContent='已添加好友 '+realName+'（'+id+'）';
    });
  }
  /* 绑定 UI —— 面板在 <template> 里，需等模块克隆完再初始化 */
  window.__fpDebug.invite=invite;window.__fpDebug.setOnline=function(id,name){online[id]={status:'online',name:name||id};render();};
  function initUI(){
  var onlineCard=document.querySelector('.mapcard[data-mode="online"]');if(onlineCard)onlineCard.addEventListener('click',function(){if(window._mpInviteSelecting){window._mpInviteSelecting=false;return;}window._mpSquad=false;});
  el('fp-myid').textContent=uid;
  el('fp-copy').onclick=function(){
    var t=uid;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){el('fp-copy').textContent='已复制';setTimeout(function(){el('fp-copy').textContent='复制'},1200)});}
    else{var i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){}i.remove();}
  };
  el('fp-rename').textContent='切换账号';
  el('fp-rename').onclick=function(){openLogin(true);};
  el('fp-addbtn').onclick=addFriend;
  el('fp-add').addEventListener('keydown',function(e){if(e.key==='Enter')addFriend()});
  el('fp-chatsend').onclick=sendChat;
  el('fp-chatinput').addEventListener('keydown',function(e){if(e.key==='Enter')sendChat()});
  var rb=document.createElement('button');
  rb.id='fp-reconn';rb.textContent='重连';rb.style.cssText='pointer-events:auto;cursor:pointer;background:#2a1a1a;color:#e3a05f;border:1px solid #6d4a23;border-radius:6px;padding:5px 12px;font-size:12px;';
  el('fp-row1').appendChild(rb);
  rb.onclick=function(){
    rb.textContent='连接中…';
    try{if(client)client.end(true)}catch(e){}
    setTimeout(function(){connect();setTimeout(function(){rb.textContent='重连'},1500)},300);
  };
  renderChat();
  window.addEventListener('beforeunload',function(){publishPresence('offline')});
  setInterval(function(){publishPresence('online')},20000);
  connect();render();
  }
  var _tries=0;
  (function waitPanel(){
    if(document.getElementById('fp-myid')){initUI();return;}
    if(++_tries<300)setTimeout(waitPanel,100);
  })();
})();
</script>
<script>
/* ════════ 本地成长：经验等级、武器熟练度、每日任务、赛后结算 ════════ */
(function(){
  var STORE='pd_progress_v1';
  var data;
  try{data=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){data={}}
  data.xp=data.xp||0; data.kills=data.kills||0; data.deaths=data.deaths||0;
  data.matches=data.matches||0; data.wins=data.wins||0; data.weapons=data.weapons||{};
  var sessionXP=0, sessionKills=0, lastSummary=null;
  function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
  function resetDaily(){
    if(!data.daily||data.daily.date!==today())data.daily={date:today(),kills:0,matches:0,wins:0,claimed:[]};
    if(!data.daily.claimed)data.daily.claimed=[];
  }
  resetDaily();
  function save(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){}}
  function need(level){return 250*level*(level-1)/2}
  function levelOf(xp){var l=1;while(l<100&&xp>=need(l+1))l++;return l}
  function addXP(n){data.xp+=n;sessionXP+=n}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function tasks(){return[
    {id:'kills',name:'每日击杀 10 人',value:data.daily.kills,target:10,reward:200},
    {id:'matches',name:'完成 1 场对局',value:data.daily.matches,target:1,reward:200},
    {id:'wins',name:'赢得 1 场对局',value:data.daily.wins,target:1,reward:200}
  ]}
  function checkTasks(){
    tasks().forEach(function(t){
      if(t.value>=t.target&&data.daily.claimed.indexOf(t.id)<0){
        data.daily.claimed.push(t.id);addXP(t.reward);
      }
    });
  }
  function render(){
    resetDaily();checkTasks();save();
    var level=levelOf(data.xp),base=need(level),next=need(level+1),pct=(data.xp-base)/(next-base)*100;
    var l=document.getElementById('pg-level');if(!l)return;
    l.textContent='等级 '+level;
    document.getElementById('pg-xptext').textContent=(data.xp-base)+' / '+(next-base)+' XP · 总经验 '+data.xp;
    document.getElementById('pg-fill').style.width=Math.max(0,Math.min(100,pct))+'%';
    document.getElementById('pg-tasks').innerHTML=tasks().map(function(t){
      var done=t.value>=t.target;
      return '<div class="pg-task'+(done?' pg-done':'')+'"><span>'+t.name+'</span><span>'+Math.min(t.value,t.target)+' / '+t.target+(done?' · 已领 +'+t.reward+'XP':'')+'</span></div>';
    }).join('');
    var names=Object.keys(data.weapons);
    document.getElementById('pg-weapons').innerHTML=names.length?names.sort(function(a,b){return data.weapons[b]-data.weapons[a]}).slice(0,5).map(function(n){
      var k=data.weapons[n];return '<div class="pg-weapon"><span>'+esc(n)+'</span><span>熟练度 '+Math.min(10,Math.floor(k/10)+1)+' · '+k+' 击杀</span></div>';
    }).join(''):'<div class="pg-weapon"><span>完成击杀后在这里显示</span></div>';
  }
  function weaponName(game){
    try{var g=game.weapons&&game.weapons.gun;return (g&&g.cfg&&(g.cfg.name||g.cfg.slug))||'当前武器'}catch(e){return'当前武器'}
  }
  function onDeath(victim,killer,headshot,game){
    if(!game||!game.player)return;
    if(killer===game.player&&victim!==game.player){
      data.kills++;sessionKills++;data.daily.kills++;
      var name=weaponName(game);data.weapons[name]=(data.weapons[name]||0)+1;
      addXP(headshot?150:100);checkTasks();save();render();
    }else if(victim===game.player){data.deaths++;save()}
  }
  function onMatch(winningTeam,game){
    if(!game||!game.player||lastSummary===game)return;
    lastSummary=game;
    var win=winningTeam===game.player.team;
    data.matches++;data.daily.matches++;if(win){data.wins++;data.daily.wins++}
    addXP(win?250:150);checkTasks();save();render();
    var level=levelOf(data.xp),base=need(level),next=need(level+1),pct=(data.xp-base)/(next-base)*100;
    var box=document.getElementById('prog-summary');
    if(!box){
      box=document.createElement('div');box.id='prog-summary';document.body.appendChild(box);
    }
    box.innerHTML='<div class="ps-box"><h2>'+(win?'胜利 · 对局结算':'对局结算')+'</h2>'
      +'<div class="ps-line"><span>本局击杀 / 死亡</span><b>'+(game.kills||0)+' / '+(game.deaths||0)+'</b></div>'
      +'<div class="ps-line"><span>对局与任务奖励已计入</span><span>本地保存</span></div>'
      +'<div class="ps-xp">+'+sessionXP+' XP</div>'
      +'<div class="ps-line"><span>当前等级</span><b>'+level+'</b></div>'
      +'<div class="ps-bar"><div class="ps-fill" style="width:'+Math.max(0,Math.min(100,pct))+'%"></div></div>'
      +'<div class="ps-line"><span>距离下一级</span><span>'+Math.max(0,next-data.xp)+' XP</span></div>'
      +'<button id="ps-close">知道了</button></div>';
    box.style.display='flex';
    document.getElementById('ps-close').onclick=function(){box.style.display='none'};
    sessionXP=0;sessionKills=0;
  }
  window.__prog={onDeath:onDeath,onMatch:onMatch,render:render,getState:function(){return JSON.parse(JSON.stringify(data))}};
  var tries=0;(function waitUI(){render();if(!document.getElementById('pg-level')&&++tries<300)setTimeout(waitUI,100)})();
})();
</script>
